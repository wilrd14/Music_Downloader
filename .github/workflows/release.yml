name: Release

# Se ejecuta al subir una etiqueta v* (p. ej. v0.1.0) o a mano (workflow_dispatch con la version).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar, sin "v" (p. ej. 0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Construir y publicar (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Calcular la version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.\-+]+)?$') { throw "Version no valida: '$v'" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Construir el zip
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version $env:VERSION

      - name: Prueba de humo (sin descarga real)
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -SkipDownload -UseLauncher

      - uses: actions/upload-artifact@v4
        with:
          name: tunedrop-windows-x64
          path: |
            dist-release/tunedrop-windows-x64.zip
            dist-release/tunedrop-windows-x64.zip.sha256
            dist-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Crear la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:VERSION"
          $sha = (Get-Content dist-release/tunedrop-windows-x64.zip.sha256 -Raw).Split(' ')[0].Trim()
          $notes = @"
          ## Instalación (Windows 10/11, 64 bits)

          1. Descarga **tunedrop-windows-x64.zip** (abajo, en *Assets*).
          2. Clic derecho sobre el zip, **Extraer todo...** (no lo ejecutes desde dentro del zip).
          3. Entra en la carpeta y haz doble clic en **Iniciar tunedrop.bat**. Se abrirá tu navegador con tunedrop.
          4. Para salir, cierra la ventana negra.

          Los archivos se guardan por defecto en ``Música\tunedrop``; se cambia con el engranaje de la aplicación.

          ## Verifica la descarga (SHA-256)

          ``````
          $sha  tunedrop-windows-x64.zip
          ``````

          En PowerShell: ``Get-FileHash .\tunedrop-windows-x64.zip -Algorithm SHA256``. Debe coincidir con la huella de arriba (también está en ``SHA256SUMS.txt``).

          ## Aviso: la aplicación no está firmada

          Windows SmartScreen o tu antivirus pueden avisar al abrirla porque tunedrop no tiene firma digital. Si la descargaste desde esta página y la huella coincide, elige *Más información* y *Ejecutar de todas formas*.

          Incluye Node.js, yt-dlp y FFmpeg (GPL); sus versiones, huellas y licencias están en la carpeta ``licenses`` del zip.

          Más información en https://tunedrop.wilrd14.dev y en el [changelog](https://github.com/$env:GH_REPO/blob/main/CHANGELOG.md).
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $flags = @()
          if ($env:VERSION.StartsWith('0.')) { $flags += '--prerelease' }
          # Con etiqueta subida: se exige que exista. Con ejecucion manual: la crea sobre este commit.
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $flags += @('--target', $env:GITHUB_SHA) } else { $flags += '--verify-tag' }
          gh release create $tag dist-release/tunedrop-windows-x64.zip dist-release/tunedrop-windows-x64.zip.sha256 dist-release/SHA256SUMS.txt --title "tunedrop $env:VERSION" --notes-file release-notes.md @flags
          if ($LASTEXITCODE -ne 0) { throw 'gh release create fallo' }
