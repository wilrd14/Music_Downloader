<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">tunedrop</title>
  <desc id="d">Descarga canciones y playlists de YouTube y YouTube Music como MP3 o M4A</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0720"/>
      <stop offset="0.55" stop-color="#1a0b3d"/>
      <stop offset="1" stop-color="#3b0a52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <!-- ecualizador decorativo -->
  <g fill="url(#accent)" opacity="0.35">
    <rect x="760" y="190" width="14" height="70" rx="7"/>
    <rect x="790" y="150" width="14" height="110" rx="7"/>
    <rect x="820" y="110" width="14" height="150" rx="7"/>
    <rect x="850" y="165" width="14" height="95" rx="7"/>
    <rect x="880" y="90" width="14" height="170" rx="7"/>
    <rect x="910" y="140" width="14" height="120" rx="7"/>
    <rect x="940" y="180" width="14" height="80" rx="7"/>
    <rect x="970" y="120" width="14" height="140" rx="7"/>
    <rect x="1000" y="160" width="14" height="100" rx="7"/>
    <rect x="1030" y="200" width="14" height="60" rx="7"/>
    <rect x="1060" y="145" width="14" height="115" rx="7"/>
    <rect x="1090" y="185" width="14" height="75" rx="7"/>
  </g>

  <!-- icono -->
  <rect x="90" y="88" width="132" height="132" rx="34" fill="url(#accent)"/>
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156 118v56"/>
    <path d="M132 152l24 24 24-24"/>
    <path d="M128 198h56"/>
  </g>

  <!-- texto -->
  <text x="262" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#word)">tunedrop</text>
  <text x="266" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#c4b5fd">Pega un enlace. Descarga tu música.</text>
  <text x="266" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#a78bfa" opacity="0.9">YouTube · YouTube Music  →  MP3 / M4A</text>
</svg>
